<div class="app-layout">
  <aside class="app-sidebar">
    <a class="brand" routerLink="/parking-spaces">
      <span class="brand-mark">P</span>
      <span>ParkShare</span>
    </a>

    <nav
      class="side-navigation"
      [attr.aria-label]="'parkingSpace.navigation.ownerMenu' | translate"
    >
      <a class="side-link active" routerLink="/parking-spaces" aria-current="page">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M5 20h14M6 20V9l6-4 6 4v11M9 20v-5h6v5"></path>
        </svg>
        {{ 'parkingSpace.navigation.mySpaces' | translate }}
      </a>
    </nav>

    <footer class="sidebar-footer">
      <strong>{{ 'parkingSpace.navigation.location' | translate }}</strong>
      <span>© 2025 ParkShare</span>
    </footer>
  </aside>

  <section class="app-workspace">
    <header class="app-header">
      <div class="role-switch" aria-label="Modo de usuario">
        <span>{{ 'parkingSpace.navigation.driver' | translate }}</span>
        <strong>{{ 'parkingSpace.navigation.owner' | translate }}</strong>
      </div>
    </header>

    <router-outlet />
  </section>
</div>
