<div class="pk-map-shell">
  <div #map class="pk-map" role="application" [attr.aria-label]="'booking.search.mapLabel' | translate"></div>

  <div class="pk-legend">
    <span class="pk-legend-item"><span class="pk-dot"></span>{{ 'booking.search.availability.available' | translate }}</span>
    <span class="pk-legend-item"><span class="pk-dot pk-dot--occupied"></span>{{ 'booking.search.legendOccupied' | translate }}</span>
  </div>
</div>
